apply plugin: 'com.android.application'

base {
    archivesName = "gnirehtet" // change apk name
}

android {
    namespace = "com.genymobile.gnirehtet"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId = "com.genymobile.gnirehtet"
        minSdk = 21
        targetSdk = 29 // must stay at 29 (no foregroundServiceType / POST_NOTIFICATIONS handling)
        versionCode = 20
        versionName = "2.7.0-beta.6"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig = signingConfigs.debug
        }
    }
    buildFeatures {
        buildConfig = true // BuildConfig.DEBUG is used
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    lint {
        // compileSdk is newer than targetSdk on purpose
        disable += ['OldTargetApi', 'ExpiredTargetSdkVersion']
    }
    testOptions {
        // android.util.Log calls must not fail in local unit tests
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
}

apply from: "$project.rootDir/config/android-checkstyle.gradle"
apply from: "$project.rootDir/config/android-signing.gradle"
