plugins {
    id 'application'
}

application {
    mainClass = 'com.genymobile.gnirehtet.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}


repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.genymobile.gnirehtet.Main'
        )
    }
    archiveBaseName = 'gnirehtet'
}

task assembleDebug(dependsOn: 'jar')
task assembleRelease(dependsOn: ['build', 'jar'])

apply from: "${project.projectDir}/../config/java-checkstyle.gradle"

test {
    // to log using System.out.println(…) in tests
    testLogging.showStandardStreams = true
}
