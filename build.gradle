// Top-level build file where you can add configuration options common to all sub-projects/modules.

ext {
    // compile against a recent SDK, but keep targetSdkVersion 29 (see app/build.gradle)
    compileSdkVersion = 34
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

task assembleDebug(dependsOn: ':app:assembleDebug')
task assembleRelease(dependsOn: ':app:assembleRelease')
task check(dependsOn: ':app:check')

